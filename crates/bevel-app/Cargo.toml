[package]
name = "bevel-app"
description = "The Bevel CAD application (desktop and web)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "bevel"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
bevel-math.workspace = true
bevel-geom.workspace = true
bevel-solver.workspace = true
bevel-expr.workspace = true
bevel-timeline.workspace = true
bevel-render.workspace = true
bevel-kernel.workspace = true
bevel-sketch.workspace = true
bevel-model.workspace = true
bevel-io.workspace = true
bevel-doc.workspace = true
bevel-script.workspace = true
bevel-ui.workspace = true
eframe.workspace = true
egui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
