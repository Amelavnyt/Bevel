<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Bevel</title>
    <link data-trunk rel="rust" href="../crates/bevel-app/Cargo.toml" data-bin="bevel" data-type="main" />
    <link data-trunk rel="rust" href="../crates/bevel-app/Cargo.toml" data-bin="bevel-worker" data-type="worker" />

      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1b1b; }

        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
